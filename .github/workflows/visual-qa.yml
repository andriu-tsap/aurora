name: Visual QA and Lighthouse
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /aurora
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - name: Lighthouse report (does not block Pages)
        if: always()
        continue-on-error: true
        run: |
          node scripts/serve-static.mjs &
          for i in {1..20}; do curl -sf http://127.0.0.1:4173/aurora/ > /dev/null && break; sleep 1; done
          node scripts/lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa
          path: qa/
      - name: Save review evidence in a dedicated branch
        if: always()
        run: |
          mkdir -p docs/visual-reviews/stage-1 docs/visual-reviews/stage-2 docs/lighthouse
          cp qa/screenshots/*.png docs/visual-reviews/stage-1/ || true
          cp qa/screenshots/stage-2/*.png docs/visual-reviews/stage-2/ || true
          cp -r qa/lighthouse/. docs/lighthouse/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b evidence/${{ github.run_id }}
          git add docs/visual-reviews docs/lighthouse
          git diff --cached --quiet || git commit -m "docs: capture visual review evidence"
          git push origin HEAD
